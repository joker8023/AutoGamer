[package]
name = "autogamer"
version = "0.1.0"
description = "AutoGamer console (Tauri shell over the game-bot engines)"
authors = ["Kai"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
